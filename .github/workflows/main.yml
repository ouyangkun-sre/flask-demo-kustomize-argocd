# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      image:
        required: true
        description: 'docker image name'
      sha-tag:
        required: true
        description: 'docker image tag'

  # Triggered by repository-dispatch from flask-demo-main CI
  repository_dispatch:
    types: [trigger-deploy]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image || github.event_name == 'repository_dispatch' }}

      - name: Set image variables
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image || github.event_name == 'repository_dispatch' }}
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${{ github.event.inputs.image }}" >> $GITHUB_OUTPUT
            echo "sha-tag=${{ github.event.inputs.sha-tag }}" >> $GITHUB_OUTPUT
          else
            echo "image=${{ github.event.client_payload.image }}" >> $GITHUB_OUTPUT
            echo "sha-tag=${{ github.event.client_payload.sha-tag }}" >> $GITHUB_OUTPUT
          fi

      - name: kustomize edit
        if: ${{ steps.vars.outputs.image }}
        run: |
          cd secret
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz" | tar xz
          ./kustomize edit set image ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha-tag }}
          rm -f kustomize

      - name: Git Commit/Push Changes
        if: ${{ steps.vars.outputs.image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add secret/kustomization.yaml
          git commit -m "kustomize set image to ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha-tag }}"
          git push
