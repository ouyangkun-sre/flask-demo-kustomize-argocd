name: CI
# 给本次 GitHub Action 内置的 `GITHUB_TOKEN` 授予【仓库内容读写权限】，允许流水线提交代码、git push 推回仓库。
permissions:
  contents: write
on:
  # 接收上游仓库 repository-dispatch 推送的事件
  repository_dispatch:
    types: [trigger-deploy]
jobs:
  write-kustomize:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ github.event.client_payload.image }} # github.event代表触发本次 workflow 的原始事件信息
      SHATAG: ${{ github.event.client_payload.sha-tag }}
    steps:
      # 下载Github代码到 runner
      - uses: actions/checkout@v4

      # 安装 kustomize
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"

      # 更新kustomize
      - name: 更新kustomize
        working-directory: ./sealed
        run: kustomize edit set image "$IMAGE:$SHATAG"

      # 提交代码
      - name: Git Push
        working-directory: ./sealed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          if git diff --cached --quiet; then
            echo "清单没有变更，跳过commit"
            exit 0
          fi
          git commit -m "update image: $IMAGE:$SHATAG"
          git push
